<dialog
  #dialogo
  class="dialog-raee"
  (cancel)="cerrar()"
  (close)="cerrar()"
  aria-labelledby="titulo-confirmacion"
>
  @if (confirmacion.estado(); as opciones) {
    <div class="p-4">
      <div class="d-flex align-items-start gap-3">
        <div class="icon-circle flex-shrink-0">
          <i class="bi bi-question-lg"></i>
        </div>
        <div>
          <h2 id="titulo-confirmacion" class="h5 mb-2">{{ opciones.titulo }}</h2>
          <p class="text-muted-soft mb-0">{{ opciones.mensaje }}</p>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4">
        <button type="button" class="btn btn-outline-secondary" (click)="cerrar()">
          {{ opciones.textoCancelar ?? 'Cancelar' }}
        </button>
        <button
          type="button"
          class="btn"
          [class.btn-danger]="opciones.peligro"
          [class.btn-raee]="!opciones.peligro"
          (click)="confirmar()"
        >
          {{ opciones.textoConfirmar ?? 'Confirmar' }}
        </button>
      </div>
    </div>
  }
</dialog>
